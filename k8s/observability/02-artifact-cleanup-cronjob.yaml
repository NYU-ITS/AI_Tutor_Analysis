# Enforces the 30-day artifact retention target on the ai-tutor-quality-artifacts
# PVC. Replaces the former S3 bucket lifecycle rule from the retired ObjectBucket
# path. Only operates inside /artifacts and keeps latest.json/index.json consistent
# by pruning entries whose run directories were deleted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-tutor-quality-artifact-cleanup
  labels:
    app.kubernetes.io/name: ai-tutor-quality-artifact-cleanup
    app.kubernetes.io/component: artifact-storage
    app.kubernetes.io/part-of: ai-tutor-observability
spec:
  schedule: "30 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai-tutor-quality-artifact-cleanup
            app.kubernetes.io/component: artifact-storage
            app.kubernetes.io/part-of: ai-tutor-observability
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            topology.kubernetes.io/region: rcdc
          containers:
            - name: artifact-cleanup
              image: image-registry.openshift-image-registry.svc:5000/rit-genai-naga-dev/ai-tutor-quality-checks:latest
              imagePullPolicy: Always
              command:
                - python
                - scripts/quality_artifact_store.py
                - cleanup-filesystem
                - --days
                - "30"
              env:
                - name: ARTIFACT_STORAGE_BACKEND
                  value: filesystem
                - name: ARTIFACT_ROOT
                  value: /artifacts
              volumeMounts:
                - name: quality-artifacts
                  mountPath: /artifacts
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: quality-artifacts
              persistentVolumeClaim:
                claimName: ai-tutor-quality-artifacts
